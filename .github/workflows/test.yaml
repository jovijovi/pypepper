name: Test

on:
  push:
    branches: [ dev-ci, main ]
  pull_request:
    branches: [ dev-ci, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt ; python -m pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Mutable class attribute check
        run: python ./scripts/check_mutable_class_attrs.py

      - name: Docs
        run: make docs

      - name: Audit production requirements and lock graph
        run: |
          python -m pip install 'pip-audit==2.10.1' 'uv==0.12.16'
          python ./scripts/pip_audit.py

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.10","3.11","3.12","3.13","3.14" ]
    name: Python ${{ matrix.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -r requirements-dev.txt ; python -m pip install -r requirements.txt

      - name: Start devenv
        run: |
          set -euo pipefail
          if docker compose -f ./devenv/ci.yaml up -d --wait; then
            echo "compose --wait succeeded"
          else
            echo "compose --wait unsupported or failed, falling back to health poll"
            docker compose -f ./devenv/ci.yaml up -d
            ok=0
            for i in $(seq 1 40); do
              if python ./scripts/check_devenv_healthy.py; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "devenv health poll timed out"
              docker compose -f ./devenv/ci.yaml ps
              exit 1
            fi
          fi
          python ./scripts/check_devenv_healthy.py
          docker compose -f ./devenv/ci.yaml ps

      - name: Mutable class attribute check
        run: python ./scripts/check_mutable_class_attrs.py

      - name: Test with coverage
        env:
          PYPEPPER_REQUIRE_DEVENV: "1"
        run: pytest --cov=pypepper --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=90 tests/

      - name: Stop devenv
        if: always()
        run: docker compose -f ./devenv/ci.yaml down

      - name: Upload coverage profile
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
