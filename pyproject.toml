[project]
name = "pypepper"
version = "0.6.6"
authors = [
    { name = "jovijovi", email = "mageyul@hotmail.com" },
]
description = "PyPepper is a microservice toolkit written in Python."
readme = "README.md"
requires-python = ">=3.10, <3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "arrow~=1.4.0",
    "cachetools~=7.2.0",
    "cryptography~=50.0.1",
    "fastapi~=0.141.1",
    "uvicorn~=0.53.0",
    "loguru~=0.7.3",
    "mongoengine~=0.29.3",
    "python-box~=7.4.1",
    "pymysql~=1.2.3",
    "psycopg[binary]~=3.3.5",
    "pyyaml~=6.0.3",
    "sqlalchemy~=2.0.54",
    "opentelemetry-api~=1.44.0",
    "opentelemetry-sdk~=1.44.0",
    "opentelemetry-exporter-otlp-proto-http~=1.44.0",
]

[project.urls]
Homepage = "https://github.com/jovijovi/pypepper"
Documentation = "https://jovijovi.github.io/pypepper/"
Repository = "https://github.com/jovijovi/pypepper"
Issues = "https://github.com/jovijovi/pypepper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pypepper"]

# Keep the lock graph off vulnerable transitives Dependabot flags in uv.lock.
# FastAPI 0.141.1 requires starlette>=0.46.0 (no upper bound). Floor 1.3.1 closes
# GHSA-jp82-gr82-jpxm and GHSA-82w8-x6qw-7x6p (a 1.1.0 floor is not enough).
[tool.uv]
constraint-dependencies = [
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "Pygments>=2.20.0",
    "click>=8.3.3",
]

[dependency-groups]
dev = [
    "build==1.6.1",
    "coverage==7.16.1",
    "httpx>=0.28.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy==2.3.1",
    "packaging==26.3",
    "pip==26.2.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "twine==7.0.0",
    "types-PyYAML>=6.0",
]

[tool.coverage.run]
source = ["pypepper"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["pypepper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S101"]

[tool.ruff.lint.per-file-ignores]
"pypepper/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["pypepper"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "box",
    "box.*",
    "mongoengine",
    "mongoengine.*",
    "cachetools",
    "cachetools.*",
    "loguru",
    "loguru.*",
    "arrow",
    "arrow.*",
]
ignore_missing_imports = true

# Stricter typing on crypto, HTTP/SSE, scheduler (incl. store), and helper.db.
[[tool.mypy.overrides]]
module = [
    "pypepper.common.security.crypto",
    "pypepper.common.security.crypto.*",
]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "pypepper.network.http.server",
    "pypepper.network.http.interfaces",
    "pypepper.network.http.handlers",
    "pypepper.network.http.handlers.*",
    "pypepper.network.http.sse.connection",
    "pypepper.network.http.sse.stream",
    "pypepper.network.http.sse.handlers",
    "pypepper.network.http.sse.interfaces",
    "pypepper.network.http.sse.security",
]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "pypepper.scheduler.task",
    "pypepper.scheduler.job",
    "pypepper.scheduler.worker",
    "pypepper.scheduler.workflow",
    "pypepper.scheduler.status",
    "pypepper.scheduler.tag",
    "pypepper.scheduler.events",
    "pypepper.scheduler.base",
    "pypepper.scheduler.store",
    "pypepper.scheduler.store.*",
]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "pypepper.helper.db",
    "pypepper.helper.db.*",
]
disallow_untyped_defs = true
warn_return_any = true
